<!DOCTYPE html>
<html>
<head>
  <title>Student Card</title>

  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }
    .cardHeader{
      display: flex;
      justify-content: center;
      padding: 0px 0px 16px;
    }

    .card {
      width: 300px;
      border: 2px dashed black;
      padding: 20px;
      margin: 50px auto;
      background-color: white;
      border-radius: 15px;
    }

    .card h2 {
      margin: 0;
      color: rgb(2, 141, 72);
    }

    .card p {
      margin: 8px 0;
      font-size: 15px;
    }

    .bio {
      margin-top: 15px;
      background-color: #eef8f0;
      padding: 10px;
      border-radius: 10px;
    }
  </style>

</head>
<body>

  <div class="card">
    <h2 class="cardHeader">Student Card</h2>
    <p><b>Name:</b> Abid Khan</p>

    <p><b>Roll Number:</b> 837049</p>
    <p><b>Course / Class:</b> Web Development</p>

    <div class="bio">
      <p><b>Short Bio:</b> I am learning HTML and CSS. I want to become a professional web developer and build modern websites.</p>
    </div>
  </div>

</body>
</html>
